<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dice body with rounded corners -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#FF6B35"/>
  <!-- Top highlight for depth -->
  <rect x="2" y="2" width="44" height="22" rx="10" fill="white" opacity="0.10"/>
  <!-- Corner dots (like a 4-face dice) -->
  <circle cx="13" cy="13" r="4" fill="white" opacity="0.88"/>
  <circle cx="35" cy="13" r="4" fill="white" opacity="0.88"/>
  <circle cx="13" cy="35" r="4" fill="white" opacity="0.88"/>
  <circle cx="35" cy="35" r="4" fill="white" opacity="0.88"/>
  <!-- Fork icon in center -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <!-- Tines -->
    <line x1="20" y1="11" x2="20" y2="20" stroke-width="2.2"/>
    <line x1="24" y1="11" x2="24" y2="20" stroke-width="2.2"/>
    <line x1="28" y1="11" x2="28" y2="20" stroke-width="2.2"/>
    <!-- Neck curve -->
    <path d="M20,20 Q20,24 24,24 Q28,24 28,20" stroke-width="2.2" fill="none"/>
    <!-- Handle -->
    <line x1="24" y1="24" x2="24" y2="37" stroke-width="2.2"/>
  </g>
</svg>
